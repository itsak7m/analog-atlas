<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cosmic Cat case</title>
<style>
  :root { --bg: #0b0f18; --fg: #e6eaf2; --dim: #9aa6bd; --amber: #ffb547; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  .bar { position: fixed; left: 16px; top: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button { background: #18202f; color: var(--fg); border: 1px solid #2a3550; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  button[aria-pressed="true"] { border-color: var(--amber); color: var(--amber); }
  .legend { position: fixed; left: 16px; bottom: 12px; color: var(--dim); line-height: 1.6; }
  .legend b { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border-radius: 2px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar">
  <strong>Cosmic Cat · field-kit case</strong>
  <button id="explode" aria-pressed="false">Exploded view</button>
  <button id="spin" aria-pressed="true">Spin</button>
  <span style="color:var(--dim)">drag to turn · wheel to zoom</span>
</div>
<div class="legend" id="legend"></div>
<script type="module">
// Preview of the STL files made by make_cat.py, assembled with assembly.json.
// A small flat-shaded renderer (painter's algorithm), no libraries.
const COLORS = { '1_body_base': '#f2f3f6', '2_lid_head': '#c9cdd4', '3_tail_tube': '#a3a9b4', '4_tailtip_shell': '#ffb547', '5_tailtip_plate': '#5ce1e6' };
const LABELS = { '1_body_base': 'body (ESP32 inside)', '2_lid_head': 'lid + head', '3_tail_tube': 'tail tube (wires, BME280 vents)', '4_tailtip_shell': 'tail tip: sky sensors', '5_tailtip_plate': 'tail tip plate: ground sensors' };
const EXPLODE = { '1_body_base': [0, 0, 0], '2_lid_head': [0, 0, 40], '3_tail_tube': [-20, 0, 20], '4_tailtip_shell': [-20, 0, 90], '5_tailtip_plate': [-20, 0, 55] };
const cv = document.getElementById('c'), g = cv.getContext('2d');
const parts = [];
for (const a of await (await fetch('assembly.json')).json()) {
  const b = new DataView(await (await fetch(a.file)).arrayBuffer());
  const n = b.getUint32(80, true), tris = [];
  for (let i = 0; i < n; i++) {
    const o = 84 + i * 50, v = [];
    for (let k = 0; k < 3; k++) {
      const s = [0, 1, 2].map((d) => b.getFloat32(o + 12 + k * 12 + d * 4, true));
      v.push([0, 1, 2].map((r) => a.m[r][0] * s[0] + a.m[r][1] * s[1] + a.m[r][2] * s[2] + a.t[r]));
    }
    // a part printed upside down maps back with a mirror (det < 0): keep the faces pointing out
    const det = a.m[0][0] * (a.m[1][1] * a.m[2][2] - a.m[1][2] * a.m[2][1]) - a.m[0][1] * (a.m[1][0] * a.m[2][2] - a.m[1][2] * a.m[2][0]) + a.m[0][2] * (a.m[1][0] * a.m[2][1] - a.m[1][1] * a.m[2][0]);
    tris.push(det < 0 ? [v[0], v[2], v[1]] : v);
  }
  parts.push({ name: a.name, tris, color: COLORS[a.name] || '#ddd' });
}
document.getElementById('legend').innerHTML = parts.map((p) => `<div><b style="background:${p.color}"></b>${LABELS[p.name] || p.name} · ${p.tris.length} triangles</div>`).join('');

// ?yaw=..&pitch=..&explode=1 sets a fixed view (spin off), for screenshots
const Q = new URLSearchParams(location.search);
let yaw = Number(Q.get('yaw') ?? 2.3), pitch = Number(Q.get('pitch') ?? 0.4), zoom = 1, exploded = Q.has('explode'), spin = !Q.has('yaw'), last = performance.now();
document.getElementById('spin').setAttribute('aria-pressed', String(spin));
document.getElementById('explode').setAttribute('aria-pressed', String(exploded));
const shade = (hex, k) => { const c = parseInt(hex.slice(1), 16); const f = (x) => Math.round(Math.min(255, x * k)); return [f(c >> 16), f((c >> 8) & 255), f(c & 255)]; };
function draw() {
  const w = cv.width = cv.clientWidth * devicePixelRatio, h = cv.height = cv.clientHeight * devicePixelRatio;
  g.fillStyle = '#0b0f18'; g.fillRect(0, 0, w, h);
  const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
  const scale = Math.min(w, h) / 260 * zoom, cx0 = w / 2, cz0 = h * 0.62;
  const light = [0.4, -0.5, 0.75], ll = Math.hypot(...light);
  const all = [];
  for (const p of parts) {
    const e = exploded ? EXPLODE[p.name] || [0, 0, 0] : [0, 0, 0];
    for (const t of p.tris) {
      const q = t.map(([x, y, z]) => {
        x += e[0] - 20; y += e[1] - 24; z += e[2] - 60;
        const x1 = x * cy - y * sy, y1 = x * sy + y * cy;
        const y2 = y1 * cp - z * sp, z2 = y1 * sp + z * cp;
        return [cx0 + x1 * scale, cz0 - z2 * scale, y2];
      });
      const [a, b, c] = t;
      const n = [(b[1] - a[1]) * (c[2] - a[2]) - (b[2] - a[2]) * (c[1] - a[1]), (b[2] - a[2]) * (c[0] - a[0]) - (b[0] - a[0]) * (c[2] - a[2]), (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0])];
      const nl = Math.hypot(...n) || 1;
      const area = (q[1][0] - q[0][0]) * (q[2][1] - q[0][1]) - (q[1][1] - q[0][1]) * (q[2][0] - q[0][0]);
      if (area > 0) continue; // back face
      const lit = 0.45 + 0.55 * Math.max(0, (n[0] * light[0] + n[1] * light[1] + n[2] * light[2]) / nl / ll);
      all.push({ q, rgb: shade(p.color, lit) });
    }
  }
  // depth buffer: every pixel keeps the nearest triangle (no sorting glitches)
  const img = g.getImageData(0, 0, w, h), px = img.data, zb = new Float32Array(w * h).fill(Infinity);
  for (const t of all) {
    const [a, b, c] = t.q, col = t.rgb;
    const x0 = Math.max(0, Math.floor(Math.min(a[0], b[0], c[0]))), x1 = Math.min(w - 1, Math.ceil(Math.max(a[0], b[0], c[0])));
    const y0 = Math.max(0, Math.floor(Math.min(a[1], b[1], c[1]))), y1 = Math.min(h - 1, Math.ceil(Math.max(a[1], b[1], c[1])));
    const den = (b[1] - c[1]) * (a[0] - c[0]) + (c[0] - b[0]) * (a[1] - c[1]);
    if (!den) continue;
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const l1 = ((b[1] - c[1]) * (x + 0.5 - c[0]) + (c[0] - b[0]) * (y + 0.5 - c[1])) / den;
      const l2 = ((c[1] - a[1]) * (x + 0.5 - c[0]) + (a[0] - c[0]) * (y + 0.5 - c[1])) / den;
      const l3 = 1 - l1 - l2;
      if (l1 < -1e-4 || l2 < -1e-4 || l3 < -1e-4) continue;
      const d = l1 * a[2] + l2 * b[2] + l3 * c[2], k = y * w + x;
      if (d >= zb[k]) continue;
      zb[k] = d; px[k * 4] = col[0]; px[k * 4 + 1] = col[1]; px[k * 4 + 2] = col[2]; px[k * 4 + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
}
let dirty = true;
function loop(now) { if (spin) { yaw += (now - last) / 4000; dirty = true; } last = now; if (dirty) { dirty = false; draw(); } requestAnimationFrame(loop); }
requestAnimationFrame(loop);
let drag = null;
cv.addEventListener('pointerdown', (e) => { drag = [e.clientX, e.clientY, yaw, pitch]; spin = false; document.getElementById('spin').setAttribute('aria-pressed', 'false'); });
addEventListener('pointerup', () => { drag = null; });
addEventListener('resize', () => { dirty = true; });
addEventListener('pointermove', (e) => { if (!drag) return; yaw = drag[2] + (e.clientX - drag[0]) / 150; pitch = Math.max(-1.4, Math.min(1.4, drag[3] + (e.clientY - drag[1]) / 150)); dirty = true; });
cv.addEventListener('wheel', (e) => { e.preventDefault(); zoom = Math.max(0.4, Math.min(4, zoom * (e.deltaY < 0 ? 1.1 : 0.9))); dirty = true; }, { passive: false });
document.getElementById('explode').onclick = (e) => { exploded = !exploded; e.target.setAttribute('aria-pressed', String(exploded)); dirty = true; };
document.getElementById('spin').onclick = (e) => { spin = !spin; e.target.setAttribute('aria-pressed', String(spin)); };
window.__view = (y, p, ex) => { yaw = y; pitch = p; exploded = !!ex; spin = false; draw(); };
document.title = 'Cosmic Cat case';
</script>
</body>
</html>
